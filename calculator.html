<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculator</h1>
    <div class="container">
        <div class="container-number">
            <button class="btn-angka" number="1">1</button>
            <button class="btn-angka" number="2">2</button>
            <button class="btn-angka" number="3">3</button>
            <button class="btn-angka" number="4">4</button>
            <button class="btn-angka" number="5">5</button>
            <button class="btn-angka" number="6">6</button>
            <button class="btn-angka" number="7">7</button>
            <button class="btn-angka" number="8">8</button>
            <button class="btn-angka" number="9">9</button>
            <button class="btn-angka" number="0">0</button>
        </div>
        <div class="container-operator">
            <button class="btn-operator" operator="+">+</button>
            <button class="btn-operator" operator="-">-</button>
            <button class="btn-operator" operator="x">x</button>
            <button class="btn-operator" operator=":">:</button>
            <button id="clear">C</button>
            <button id="equals">=</button>
        </div>
    </div>
</body>
</html>
