<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Login V2 - Project 03</title>
        <style>
            .container-register {
                display: none;
            }
            .container {
                display: block;
            }
        </style>
    </head>
    <body>
        <div class="container-register">
            <h1>Register</h1>
            <input type="text" id="new-username" placeholder="username baru" />
            <input
                type="password"
                id="new-password"
                placeholder="password baru"
            />
            <input
                type="password"
                id="confirm-password"
                placeholder="konfirmasi password"
            />
            <p id="status-register"></p>
            <button id="show-login-form">Login</button>
            <button id="register-btn">Register</button>
        </div>
        <div class="container-login">
            <h1>Login</h1>
            <input type="text" id="username" placeholder="username" />
            <input type="password" id="password" placeholder="password" />
            <button id="show-register-form">buat akun baru</button>
            <button id="btn">Login</button>
            <p>Status :</p>
            <p id="status">Belum login</p>
        </div>

        <script>
            const newPassword = document.getElementById("new-password");
            const newUsername = document.getElementById("new-username");
            const confirmPassword = document.getElementById("confirm-password");
            const statusRegister = document.getElementById("status-register");
            const registerBtn = document.getElementById("register-btn");
            const showLoginForm = document.getElementById("show-login-form");
            const containerRegister = document.querySelector(
                ".container-register"
            );

            const username = document.getElementById("username");
            const password = document.getElementById("password");
            const btn = document.getElementById("btn");
            const status = document.getElementById("status");
            const containerLogin = document.querySelector(".container-login");
            const showRegisterForm =
                document.getElementById("show-register-form");

            let account =
                {
                    username: newUsername.value,
                    password: newPassword
                } || JSON.parse(localStorage.getItem("account"));
            function delay(milidetik) {
                return new Promise(resolve => {
                    setTimeout(resolve, milidetik);
                });
            }
            async function proses() {
                try {
                    const user = await login(
                        account.username,
                        account.password
                    );
                    status.textContent = "Login berhasil...";
                    await delay(1000);
                    status.textContent = `Selamat datang,${user}`;
                } catch (error) {
                    status.textContent = error;
                }
            }
            function login(user, pass) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (
                            user === username.value &&
                            pass === password.value
                        ) {
                            resolve(user);
                        } else if (
                            user !== username.value &&
                            pass !== password.value
                        ) {
                            reject("akun tidak ditemukan!");
                        } else {
                            reject("username atau password salah!");
                        }
                    }, 2000);
                });
            }
            btn.addEventListener("click", () => {
                if (username.value === "" || password.value === "") {
                    status.textContent = "Masukkan Username dan Password!";
                    username.value = "";
                    password.value = "";
                } else {
                    status.textContent = "Sedang menghubungkan ke server...";
                    proses();
                }
            });
            showRegisterForm.addEventListener("click", () => {
                containerRegister.style.display = "block";
                containerLogin.style.display = "none";
            });
            registerBtn.addEventListener("click", () => {
                if (
                    newUsername.value === "" ||
                    newPassword.value === "" ||
                    confirmPassword.value === ""
                ) {
                    statusRegister.textContent =
                        "Masukkan Username dan Password!";
                    newUsername.value = "";
                    newPassword.value = "";
                    confirmPassword.value = "";
                    return;
                } else if (newPassword.value !== confirmPassword.value) {
                    statusRegister.textContent =
                        "konfirmasi password tidak valid!";
                    return;
                }
                account = {
                    username: newUsername.value,
                    password: newPassword.value
                };
                localStorage.setItem("account", JSON.stringify(account));
                statusRegister.textContent = "akun berhasil dibuat!";
            });
            showLoginForm.addEventListener("click", () => {
                containerRegister.style.display = "none";
                containerLogin.style.display = "block";
            });
        </script>
    </body>
</html>
